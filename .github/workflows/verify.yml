# CI tohohle repozitáře. Samo nic nespouští – volá sdílený
# `contract.yml`, který stejně volají projekty, jen místo připnutého SHA
# lokální cestou: tady je workflow i konfigurační vrstva v témže commitu.

name: Kontroly

on:
  push:
  pull_request:
  workflow_dispatch:

# Token jobu nesmí umět zapisovat. Bez tohohle bloku rozhoduje nastavení
# GitHubu (Settings → Actions), tedy hodnota mimo repozitář, kterou kdokoli
# s právy přepne a od dalšího pushe dostane každý job zapisovací
# `GITHUB_TOKEN` – aniž by se v repozitáři cokoli změnilo. Volaný workflow
# oprávnění dědí a víc si vzít nemůže.
permissions:
  contents: read

jobs:
  contract:
    uses: ./.github/workflows/contract.yml
    with:
      # macOS kvůli `swiftc` v klíči `typecheck`.
      runs-on: macos-latest
      # Ruff se nepřipíná vědomě – viz `BYPASS.md`, *CI*.
      install: |
        command -v shellcheck >/dev/null || brew install shellcheck
        command -v gtimeout >/dev/null || brew install coreutils
        python3 -m pip install --quiet ruff
