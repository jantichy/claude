# Tytéž kontroly, jaké lokálně pouští `verify.sh` po každé odpovědi – jenže na
# cizím stroji a bez souhlasu, který jde odvolat. Lokální vrstvu obejde commit
# z jiného počítače, z GUI, s `--no-verify` i cizí fork; tahle ne.
#
# Příkazy se odsud neopisují ani neparsují podruhé: vypíše je `verify.sh
# --contract`, tedy tentýž kód, který je spouští lokálně. Vlastní parser tu byl
# do 13. 9. 2026 a rozešel se s ním ve třech vlastnostech naráz.

name: Kontroly

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kontrakt:
    # macOS kvůli `swiftc` – na Linuxu není a typecheck by se musel vynechat.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Doinstaluj nástroje
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          # `verify.sh` si hlídá timeout přes gtimeout; na čistém macOS není.
          command -v gtimeout >/dev/null || brew install coreutils
          python3 -m pip install --quiet ruff

      # Obecné nástroje, které nejsou příkazem projektu, takže v kontraktu nestojí
      # a smyčka výš je nepustí. Do CI patří přesto: jsou deterministické, rychlé
      # a jejich nález je vždy kritický. Bez nich by scan tajemství běžel jen tehdy,
      # když někdo pustí `/review` na stroji, kde má gitleaks nainstalovaný.
      - name: Tajemství v repu
        run: |
          command -v gitleaks >/dev/null || brew install gitleaks
          gitleaks detect --no-banner --redact

      - name: Statická analýza
        run: |
          python3 -m pip install --quiet semgrep
          # Jen vlastní kód: `plugins/` je cizí a jeho nálezy nemá kdo opravit.
          semgrep --config p/owasp-top-ten --quiet --error githooks tests skills

      - name: Spusť kontrakt příkazů
        run: |
          set -e
          # Kontrakt čte `verify.sh --contract`, ne vlastní parser. Dřív si ho
          # workflow parsovalo samo a ta druhá implementace se s první rozešla
          # hned ve třech vlastnostech: nefiltrovala HTML komentáře (zakomentovaná
          # sekce nad tou pravou tu vyhrála), neměla pojistku proti dvěma sekcím
          # téhož jména a neznala klíč cwd.
          ./verify.sh --contract . > "$RUNNER_TEMP/kontrakt.tsv"
          cat "$RUNNER_TEMP/kontrakt.tsv"

          # cwd posouvá, kde se příkazy spouštějí – průběžná kontrola ho respektuje,
          # takže CI musí taky, jinak by každá pouštěla něco jiného.
          cwd=$(awk -F'\t' '$1 == "cwd" { print $2 }' "$RUNNER_TEMP/kontrakt.tsv")
          [ -n "$cwd" ] && cd "$cwd"

          # Jmenovaný seznam kroků, které do CI patří. Ne všechny klíče kontraktu:
          # `dev` je watch server, který nikdy neskončí, `cwd` není příkaz. Klíč,
          # který projekt nemá, se přeskočí nahlas.
          status=0
          for klic in typecheck lint test build e2e audit coverage a11y perf mutation; do
            prikaz=$(awk -F'\t' -v k="$klic" '$1 == k { print $2 }' "$RUNNER_TEMP/kontrakt.tsv")
            if [ -z "$prikaz" ]; then
              echo "::notice::$klic – není v kontraktu, nekontroluje se"
              continue
            fi
            if [ "$prikaz" = "-" ]; then
              echo "::notice::$klic – projekt ho vědomě nemá"
              continue
            fi
            echo "::group::$klic"
            if sh -c "$prikaz"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$klic selhal"
              status=1
            fi
          done
          exit $status
